<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        // Fix: Make window.fetch writable so scripts/polyfills wrapping fetch don't throw TypeError
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Property may already be non-configurable in some environments
        }

        // Global unhandled error listener to prevent app disruption
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            event.message.indexOf('fetch') !== -1 &&
            event.message.indexOf('getter') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>SwapCircle - Barter & Free Sustainability Marketplace</title>
    <meta name="description" content="A sustainability and barter marketplace to exchange or give away items for free with location and messaging." />
    <meta property="og:title" content="SwapCircle - Barter & Free Sustainability Marketplace" />
    <meta property="og:description" content="Trade, share, and reuse with your local community." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fbf8fc] text-[#1b1b1e] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
